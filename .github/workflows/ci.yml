name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mellea:
    name: Mellea offline control flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Mellea runtime
        run: python -m pip install mellea==0.8.0
      - name: Run real sampling with fixture generation and verification
        run: python -m unittest discover -s evaluation -p 'test_mellea_candidate*.py'

  providers:
    name: Evaluation provider contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install released adapter and offline test dependencies
        run: python -m pip install -r evaluation/requirements-provider-tests.txt
      - name: Check copied ProxyAPI bridge without inference
        run: python -m pytest evaluation/test_proxyapi_provider.py evaluation/test_verifier_capture.py evaluation/test_harness_v2.py evaluation/test_provider_smoke.py evaluation/test_retry_contracts_v2.py -q

  stage1:
    name: Stage 1 dataset audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate synthetic sources, candidate mutations and frozen contract
        run: python -m unittest discover -s evaluation -p 'test_stage1*.py'

      - name: Check development corpus inventory without inference
        run: python -B -S evaluation/audit_pipeline_corpus.py --check

      - name: Check external diagnostic snapshots without network or inference
        run: python -B -S evaluation/collect_external_diagnostics.py --check

      - name: Check candidate review hashes and exact source anchors
        run: python -B -S evaluation/check_external_diagnostic_review.py

      - name: Check S1.3 frozen offline plan and replay without inference
        run: python -B -S evaluation/s13_offline.py check

      - name: Check offline export, comparison and portable reader with network denied
        run: python -B -S -m unittest discover -s evaluation -p 'test_offline_*.py' -v

  mlflow:
    name: Local MLflow import contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned MLflow runtime
        run: python -m pip install mlflow==3.16.1
      - name: Check local SQLite import and concurrent recovery with network denied
        env:
          MLFLOW_DISABLE_AGENT_HINT: '1'
          MLFLOW_DISABLE_TELEMETRY: 'true'
        run: python -B -m unittest discover -s evaluation -p 'test_mlflow_import.py' -v

  architecture:
    name: FSD architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Check FSD layers, public APIs, and import boundaries
        run: npm run lint:architecture

      - name: Verify glob protection and forbidden-import regression probes
        run: npm run test:architecture

  verify:
    name: Format, lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NORMLAB_LEAN_MEMORY_MB: 1024
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Set up Python for evaluation lint
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Check evaluation Python style
        run: |
          python -m pip install ruff==0.15.0
          ruff check --select E4,E7,E9,F,I evaluation
          ruff format --check evaluation

      - name: Check formatting
        run: npm run format:check

      - name: Check complete classification contract
        run: python evaluation/check_classification_v3.py "$RUNNER_TEMP/normlab-classification-contract"

      - name: Check Mellea candidate contracts without inference
        run: python -m unittest discover -s evaluation -p 'test_mellea_candidate*.py'

      - name: Lint TypeScript and public API re-export guards
        run: npm run lint:code

      - name: Check TypeScript types
        run: npm run check

      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Verify Lean toolchain
        run: lean --version

      - name: Run domain and API tests
        run: npm test

      - name: Check generated schemas
        run: npm run schemas:check

      - name: Check candidate parking reference graphs
        run: npm run parking:references:check

      - name: Run Lean proof integration tests
        run: npm run test:lean

      - name: Build production assets
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
