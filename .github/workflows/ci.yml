name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NORMLAB_LEAN_MEMORY_MB: 1024
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint with type-aware rules
        run: npm run lint

      - name: Check TypeScript types
        run: npm run check

      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Verify Lean toolchain
        run: lean --version

      - name: Run domain and API tests
        run: npm test

      - name: Check generated schemas
        run: npm run schemas:check

      - name: Run Lean proof integration tests
        run: npm run test:lean

      - name: Build production assets
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
