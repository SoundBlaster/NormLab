name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mellea:
    name: Mellea offline control flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Mellea runtime
        run: python -m pip install mellea==0.8.0
      - name: Run real sampling with fixture generation and verification
        run: python -m unittest discover -s evaluation -p 'test_mellea_candidate*.py'

  providers:
    name: Evaluation provider contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install released adapter and offline test dependencies
        run: python -m pip install -r evaluation/requirements-provider-tests.txt
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Check current SDK, previous bridge/captures and Mellea hooks without inference
        run: python -m pytest evaluation/test_provider_runtime.py evaluation/test_responses_runtime.py evaluation/test_categorical_runtime.py evaluation/test_liquid_runtime.py evaluation/test_provider_smoke.py evaluation/test_proxyapi_provider.py evaluation/test_verifier_capture.py evaluation/test_harness_v2.py evaluation/test_adapter_compatibility.py -q
      - name: Check Clairic total deadline without inference
        run: python -m unittest discover -s scripts -p 'test_clairic_deadline.py'
      - name: Check frozen Stage 1 SDK contracts with a mock-only version-gate probe
        run: >-
          python evaluation/check_legacy_sdk_compatibility.py
          --report "$RUNNER_TEMP/legacy-sdk-compatibility.json"
          --temp-dir "$RUNNER_TEMP/legacy-sdk-compatibility-tests"
          --cache-dir "$RUNNER_TEMP/legacy-sdk-compatibility-cache"

  stage1:
    name: Stage 1 dataset audit
    runs-on: ubuntu-24.04
    # Full SDK-free regression includes bounded corpus/archive round trips.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate synthetic sources, candidate mutations and frozen contract
        run: python -m unittest discover -s evaluation -p 'test_stage1*.py'

      - name: Check development corpus inventory without inference
        run: python -B -S evaluation/audit_pipeline_corpus.py --check

      - name: Check external diagnostic snapshots without network or inference
        run: python -B -S evaluation/collect_external_diagnostics.py --check

      - name: Check candidate review hashes and exact source anchors
        run: python -B -S evaluation/check_external_diagnostic_review.py

      - name: Check S1.3 frozen offline plan and replay without inference
        run: python -B -S evaluation/s13_offline.py check

      - name: Check offline export, comparison and portable reader with network denied
        run: python -B -S -m unittest discover -s evaluation -p 'test_offline_*.py' -v

  mlflow:
    name: Local MLflow import contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned MLflow runtime
        run: python -m pip install mlflow==3.16.1
      - name: Check local SQLite import and concurrent recovery with network denied
        env:
          MLFLOW_DISABLE_AGENT_HINT: '1'
          MLFLOW_DISABLE_TELEMETRY: 'true'
        run: python -B -m unittest discover -s evaluation -p 'test_mlflow*import.py' -v

  architecture:
    name: FSD architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Check FSD layers, public APIs, and import boundaries
        run: npm run lint:architecture

      - name: Verify glob protection and forbidden-import regression probes
        run: npm run test:architecture

  verify:
    name: Format, lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NORMLAB_LEAN_MEMORY_MB: 1024
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Set up Python for evaluation lint
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Check evaluation Python style
        run: |
          python -m pip install ruff==0.15.0
          ruff check --select E4,E7,E9,F,I evaluation
          ruff format --check evaluation

      - name: Check formatting
        run: npm run format:check

      - name: Check complete classification contract
        run: python evaluation/check_classification_v3.py "$RUNNER_TEMP/normlab-classification-contract"

      - name: Check Mellea candidate contracts without inference
        run: python -m unittest discover -s evaluation -p 'test_mellea_candidate*.py'

      - name: Check Clairic smoke without inference
        run: python -m unittest discover -s scripts -p 'test_clairic*.py'

      - name: Lint TypeScript and public API re-export guards
        run: npm run lint:code

      - name: Check TypeScript types
        run: npm run check

      - name: Check optional parking motivation artifacts and authored development set
        run: |
          npm run parking:motivation:check
          npm run parking:motivation -- export "$RUNNER_TEMP/parking-motivation-plan"
          python -B -S evaluation/check_parking_motivation_plan.py "$RUNNER_TEMP/parking-motivation-plan"

      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Verify Lean toolchain
        run: lean --version

      - name: Check isolated relation proofs and enforce axiom allowlist
        run: |
          RELATIONS_BUILD_DIR="$(mktemp -d "$RUNNER_TEMP/normlab-relations.XXXXXX")"
          lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/Relations.olean" lean/Relations.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckRelations.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/StateRelations.olean" lean/StateRelations.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckStateRelations.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/DerivationTraces.olean" lean/DerivationTraces.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckDerivationTraces.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/EventTransitions.olean" lean/EventTransitions.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckEventTransitions.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/ActionAttribution.olean" lean/ActionAttribution.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckActionAttribution.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/ParkingAttribution.olean" lean/ParkingAttribution.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckParkingAttribution.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/Parking.olean" lean/Parking.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true -o "$RELATIONS_BUILD_DIR/ParkingRuntime.olean" lean/ParkingRuntime.lean
          LEAN_PATH="$RELATIONS_BUILD_DIR" lean -DwarningAsError=true lean/CheckParkingRuntime.lean

      - name: Run domain and API tests
        run: npm test

      - name: Check generated schemas
        run: npm run schemas:check

      - name: Check candidate parking reference graphs
        run: npm run parking:references:check

      - name: Prebuild pinned parking Lean runtime artifacts
        run: npm run parking:runtime:build -- --output .lean-runtime

      - name: Run Lean proof integration tests
        run: npm run test:lean

      - name: Build production assets
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
