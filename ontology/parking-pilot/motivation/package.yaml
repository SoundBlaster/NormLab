apiVersion: ontology.specgraph.io/v1alpha1
kind: DomainOntologyPackage
metadata:
  id: normlab.parking-motivation
  namespace: nlmot
  version: 0.1.0
  publisher: NormLab
  source: docs/PARKING_MOTIVATION.md
  approvalStatus: draft
spec:
  imports:
    - {id: specgraph.foundation, namespace: sg, version: 0.1.0}
    - {id: normlab.case-core, namespace: nlcase, version: 0.1.0}
    - {id: normlab.parking, namespace: nlpark, version: 0.1.0}
    - {id: org.0al.events.core, namespace: eventcore, version: 0.2.0}
    - {id: org.0al.motivation.core, namespace: motivcore, version: 0.1.0}
  classes:
    ParkingContribution:
      extends: sg:DomainEntity
      lifecycle: ContributionScopeReview
      description: Operator-supplied scope for a reported parking action or omission. This bridge does not establish an occurrence or physical observations.
      fields:
        contributionKey: {type: string, required: true}
        description: {type: string, required: false}
    ReviewContributionScope:
      extends: sg:Command
      description: Review the supplied contribution scope without establishing its physical occurrence or motive.
  protocols: {}
  relations:
    contributionEpisode:
      domain: ParkingContribution
      range: nlcase:Episode
      cardinality: {min: 1, max: 1}
      description: Selected source episode; labels do not merge episodes.
    contributionView:
      domain: ParkingContribution
      range: eventcore:InterpretationCandidate
      cardinality: {min: 1, max: 1}
      description: Source-only view, with unknown physical states preserved.
    contributionMotivation:
      domain: ParkingContribution
      range: motivcore:MotivationHypothesis
      cardinality: {min: 0, max: '*'}
      description: Optional generic hypothesis whose hypothesisView must equal the selected contributionView. No local Motive subclass or duplicate truth state.
  policies:
    ScopedSourceProposal:
      extends: sg:Policy
      enforceability: manual
      appliesTo: [ParkingContribution]
      text: Reuse motivcore Motive and MotivationHypothesis. Each hypothesis selects this contribution's view; a resolved actor role is reached from that view, not from the quote speaker. An unresolved actor stays unresolved. Narrative sources alone do not authorize RecordedEvent, physical StateSnapshot or Delta creation. Unknown change is not an empty diff.
    SeparateMotiveAndConsequence:
      extends: sg:Policy
      enforceability: manual
      appliesTo: [ParkingContribution]
      text: Any Entity may be actor, including AI, machine, community and natural phenomenon, without intention. Own change and downstream hypothesized consequence remain distinct. An omission has its own view, and any downstream effect needs a separate causal hypothesis; do not select a movement view merely to obtain a nonempty Delta. Motive proposals do not update legal findings or imply liability, permission or sanction.
    ExplicitConsumerBoundary:
      extends: sg:Policy
      enforceability: manual
      appliesTo: [ParkingContribution]
      text: Generated object schemas do not implement graph policies. normlab.parking-motivation-proposal/v1 is a narrower optional source-extraction envelope, not an extension of eventcore instance profiles or Lean. Exact quotes and selected identifiers establish structural anchoring only, not relevance, authenticity or factual truth. Review and operator authority require separate application decisions.
  stateMachines:
    ContributionScopeReview:
      states: [proposed, reviewed]
      transitions:
        - {from: proposed, to: reviewed, command: ReviewContributionScope}
