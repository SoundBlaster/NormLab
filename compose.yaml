services:
  normlab:
    build: .
    image: normlab-normlab:latest
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: ${NORMLAB_PORT:-4317}
      NORMLAB_LEAN_MEMORY_MB: ${NORMLAB_LEAN_MEMORY_MB:-1024}
      NORMLAB_DATA_DIR: /var/lib/normlab
    ports:
      - '127.0.0.1:${NORMLAB_PORT:-4317}:${NORMLAB_PORT:-4317}'
    volumes:
      - normlab-data:/var/lib/normlab
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/api/bootstrap').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  normlab-data:
    name: ${NORMLAB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-normlab}_normlab-data}
